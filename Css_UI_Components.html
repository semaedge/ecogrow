<style>
  .card { padding: 22px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-sm); }
  .card-header { margin-bottom: 14px; color: var(--text-color); font: 800 18px/1.25 'Manrope'; }
  .card-body { color: var(--text-muted); }

  .modal { display: none; position: fixed; inset: 0; z-index: 2000; align-items: center; justify-content: center; padding: 20px; background: rgba(10,35,27,.48); backdrop-filter: blur(5px); }
  .modal-content { width: min(560px, 100%); max-height: min(760px, calc(100vh - 40px)); overflow: auto; padding: 26px; border: 1px solid rgba(255,255,255,.5); border-radius: var(--radius-lg); background: var(--surface); box-shadow: 0 30px 70px rgba(8,35,25,.28); animation: modal-in .22s ease both; }
  @keyframes modal-in { from { opacity: 0; transform: translateY(12px) scale(.98); } }
  .modal-content h2 { padding-right: 38px; font-size: 24px; }
  .modal-body { margin-top: 20px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 9px; margin-top: 22px; }
  .close-button { float: right; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 9px; color: var(--text-muted); font-size: 24px; line-height: 1; cursor: pointer; }
  .close-button:hover, .close-button:focus { background: var(--surface-alt); color: var(--text-color); }

  .tabs { display: flex; gap: 6px; margin: 22px 0; padding: 5px; border-radius: 12px; background: var(--surface-alt); }
  .tab-button { flex: 1; min-height: 40px; padding: 0 13px; border: 0; border-radius: 9px; background: transparent; color: var(--text-muted); font-weight: 700; cursor: pointer; }
  .tab-button.active { background: #fff; color: var(--primary-strong); box-shadow: var(--shadow-sm); }
  .tab-content { padding: 4px 2px; }

  .progress-bar-container { width: 100%; height: 9px; overflow: hidden; margin-top: 10px; border-radius: 99px; background: var(--surface-alt); }
  .progress-bar-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--primary-color), #43a978); color: transparent; transition: width .55s ease; }

  .empty-state { padding: 26px 18px; border: 1px dashed #c9d8cf; border-radius: 13px; text-align: center; color: var(--text-muted); }
  .empty-state strong { display: block; margin-bottom: 3px; color: var(--text-color); }
</style>
