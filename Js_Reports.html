<script>
  var Js_Reports = {
    lifecycleVersion: 0,
    boardRequestVersion: 0,
    reports: { user: null, board: null },

    init: function () {
      this.lifecycleVersion += 1;
      this.boardRequestVersion = 0;
      this.reports = { user: null, board: null };
      this.setupEventListeners();
      this.loadUserPerformanceReport(this.lifecycleVersion);
      this.loadBoardSelectionForReports(this.lifecycleVersion);
    },

    destroy: function () { this.lifecycleVersion += 1; },

    setupEventListeners: function () {
      document.querySelectorAll('.tab-button').forEach(function (button) {
        button.type = 'button';
        button.setAttribute('role', 'tab');
        button.addEventListener('click', Js_Reports.handleTabClick.bind(Js_Reports));
      });
      var select = document.getElementById('select-board-for-report');
      var userDownload = document.getElementById('download-user-report-btn');
      var boardDownload = document.getElementById('download-board-report-btn');
      if (select) select.addEventListener('change', this.handleBoardSelectionChange.bind(this));
      if (userDownload) userDownload.addEventListener('click', this.handleDownloadUserReport.bind(this));
      if (boardDownload) boardDownload.addEventListener('click', this.handleDownloadBoardReport.bind(this));
    },

    handleTabClick: function (event) {
      var targetTab = event.currentTarget.dataset.tab;
      document.querySelectorAll('.tab-button').forEach(function (button) {
        var active = button === event.currentTarget;
        button.classList.toggle('active', active);
        button.setAttribute('aria-selected', String(active));
      });
      document.querySelectorAll('.tab-content').forEach(function (content) {
        content.classList.toggle('hidden', content.id !== targetTab + '-tab');
      });
    },

    loadUserPerformanceReport: function (version) {
      EcoGrow.Api.call('report/generate', { reportType: 'user_performance' }).then(function (data) {
        if (version !== Js_Reports.lifecycleVersion) return;
        Js_Reports.reports.user = data;
        var content = document.getElementById('user-performance-report-content');
        if (content) content.innerHTML = Js_Reports.renderMarkdown(data.report);
      }).catch(function (error) {
        if (version !== Js_Reports.lifecycleVersion) return;
        var content = document.getElementById('user-performance-report-content');
        if (content) content.innerHTML = '<p>Não foi possível carregar o relatório.</p>';
        EcoGrow.UI.showMessage('Erro ao carregar o relatório: ' + error.message, 'error');
      });
    },

    loadBoardSelectionForReports: function (version) {
      EcoGrow.Api.call('board/listUserBoards').then(function (data) {
        if (version !== Js_Reports.lifecycleVersion) return;
        var select = document.getElementById('select-board-for-report');
        if (!select) return;
        select.innerHTML = '';
        var prompt = document.createElement('option');
        prompt.value = '';
        prompt.textContent = 'Selecione um tabuleiro';
        select.appendChild(prompt);
        (Array.isArray(data.boards) ? data.boards : []).forEach(function (board) {
          var option = document.createElement('option');
          option.value = board.id;
          option.textContent = board.name || 'Sistema sem nome';
          select.appendChild(option);
        });
      }).catch(function (error) {
        EcoGrow.UI.showMessage('Erro ao carregar a lista de tabuleiros: ' + error.message, 'error');
      });
    },

    handleBoardSelectionChange: function (event) {
      var boardId = event.currentTarget.value;
      var content = document.getElementById('board-analysis-report-content');
      var downloadButton = document.getElementById('download-board-report-btn');
      this.reports.board = null;
      if (!boardId) {
        if (content) content.innerHTML = '<p>Selecione um tabuleiro para ver a análise.</p>';
        if (downloadButton) downloadButton.hidden = true;
        return;
      }
      if (content) content.innerHTML = '<p>Carregando análise do tabuleiro…</p>';
      if (downloadButton) downloadButton.hidden = true;
      var lifecycleVersion = this.lifecycleVersion;
      var requestVersion = ++this.boardRequestVersion;
      EcoGrow.Api.call('report/generate', { reportType: 'board_analysis', boardId: boardId }).then(function (data) {
        if (lifecycleVersion !== Js_Reports.lifecycleVersion || requestVersion !== Js_Reports.boardRequestVersion) return;
        Js_Reports.reports.board = data;
        if (content) content.innerHTML = Js_Reports.renderMarkdown(data.report);
        if (downloadButton) downloadButton.hidden = false;
      }).catch(function (error) {
        if (lifecycleVersion !== Js_Reports.lifecycleVersion || requestVersion !== Js_Reports.boardRequestVersion) return;
        if (content) content.innerHTML = '<p>Não foi possível carregar a análise.</p>';
        EcoGrow.UI.showMessage('Erro ao carregar a análise: ' + error.message, 'error');
      });
    },

    handleDownloadUserReport: function () {
      if (this.reports.user) {
        this.downloadFile(this.reports.user.filename, this.reports.user.report, 'text/markdown;charset=utf-8');
        return;
      }
      EcoGrow.UI.showMessage('Aguarde o carregamento do relatório.', 'warning');
    },

    handleDownloadBoardReport: function () {
      if (this.reports.board) {
        this.downloadFile(this.reports.board.filename, this.reports.board.report, 'text/markdown;charset=utf-8');
        return;
      }
      EcoGrow.UI.showMessage('Selecione e carregue um tabuleiro antes do download.', 'warning');
    },

    renderInline: function (text) {
      var html = EcoGrow.UI.escapeHtml(text || '');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      return html;
    },

    renderMarkdown: function (markdownText) {
      var lines = String(markdownText || '').replace(/\r\n?/g, '\n').split('\n');
      var html = [];
      var inList = false;
      var inCode = false;
      var code = [];
      function closeList() { if (inList) { html.push('</ul>'); inList = false; } }
      lines.forEach(function (line) {
        if (/^```/.test(line)) {
          closeList();
          if (inCode) {
            html.push('<pre><code>' + EcoGrow.UI.escapeHtml(code.join('\n')) + '</code></pre>');
            code = [];
          }
          inCode = !inCode;
          return;
        }
        if (inCode) { code.push(line); return; }
        var heading = line.match(/^(#{1,3})\s+(.+)$/);
        var item = line.match(/^\s*-\s+(.+)$/);
        if (heading) {
          closeList();
          var level = heading[1].length;
          html.push('<h' + level + '>' + Js_Reports.renderInline(heading[2]) + '</h' + level + '>');
        } else if (item) {
          if (!inList) { html.push('<ul>'); inList = true; }
          html.push('<li>' + Js_Reports.renderInline(item[1]) + '</li>');
        } else if (!line.trim()) {
          closeList();
        } else {
          closeList();
          html.push('<p>' + Js_Reports.renderInline(line) + '</p>');
        }
      });
      closeList();
      if (inCode) html.push('<pre><code>' + EcoGrow.UI.escapeHtml(code.join('\n')) + '</code></pre>');
      return html.join('');
    },

    downloadFile: function (filename, content, mimeType) {
      var safeName = String(filename || 'EcoGrow_Report.md').replace(/[\\/:*?"<>|]+/g, '_');
      var blob = new Blob(['\ufeff', content || ''], { type: mimeType });
      var url = URL.createObjectURL(blob);
      var anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = safeName;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      window.setTimeout(function () { URL.revokeObjectURL(url); }, 0);
    }
  };
</script>
